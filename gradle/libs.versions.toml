[versions]
# Toolchain: Gradle 8.13 + AGP 8.12.0 + Kotlin 2.2.10, the same set the other
# Android project on this machine builds with. Gradle 8.13 runs on JDK 17-23,
# which is why the daemon JVM is pinned in ~/.gradle/gradle.properties.
agp = "8.12.0"
kotlin = "2.2.10"

# AndroidX / Compose
coreKtx = "1.17.0"
composeBom = "2025.08.00"
material3 = "1.4.0"
activityCompose = "1.10.1"
navigation = "2.9.3"
lifecycle = "2.9.2"
datastore = "1.1.7"

# Picks the app's own language. Android 13 keeps that per app itself, and this
# library does the same job on the phones before it.
appcompat = "1.7.1"

# The lock. The platform's own prompt cannot ask for a fingerprint and a PIN in
# one sheet before Android 11, and this library papers over the difference.
biometric = "1.1.0"

# Media3 plays the event clips. The clip endpoint needs the session token, so the
# player gets a data source that sends the header with every request.
media3 = "1.11.1"

# Networking. Frigate's API is small and stable, so a hand-written OkHttp client
# is less machinery than Retrofit and converters. OkHttp 5 needs compileSdk 37,
# which this AGP cannot target yet, so this stays on the 4.x line.
okhttp = "4.12.0"
serialization = "1.11.0"

# Testing
junit = "4.13.2"
androidxJunit = "1.3.0"

# The data layer says its sentences with the app's own strings, so the tests that
# read those sentences need a real Context and the real resources. Robolectric is
# that, and it is a test-only dependency: nothing of it is in the APK.
robolectric = "4.14.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
