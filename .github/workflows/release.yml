name: Release

# A release is cut from the GitHub UI: Actions, Release, Run workflow, type the
# version. The workflow builds it, signs it, tags the commit and publishes the
# APK on the release page. Pushing a tag by hand does the same thing.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.7.3'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Work out the version
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"

          # Exactly three numeric parts, because the version code is derived from
          # them. A tag like v1.2 would quietly map onto another release's code.
          if ! echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version ${TAG} is not in the form v<major>.<minor>.<patch>"
            exit 1
          fi

          # 0.7.3 -> 703. Derived from the version rather than the run number, so a
          # phone that already has 0.7.3 always accepts 0.7.4 next.
          MAJOR="$(echo "${VERSION}" | cut -d. -f1)"
          MINOR="$(echo "${VERSION}" | cut -d. -f2)"
          PATCH="$(echo "${VERSION}" | cut -d. -f3)"

          # The code gives each part two decimal places, so 0.7.100 and 0.8.0 are
          # both 800. A part past 99 would quietly take another release's code,
          # and the phone would refuse it as a downgrade or install the wrong one.
          if [ "${MINOR}" -gt 99 ] || [ "${PATCH}" -gt 99 ]; then
            echo "::error::${VERSION} has a part above 99; the version code only has room for two digits of each"
            exit 1
          fi

          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "name=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "code=${CODE}" >> "${GITHUB_OUTPUT}"
          echo "Releasing ${TAG} as versionName ${VERSION}, versionCode ${CODE}"

      # The release page says what changed, which is also what the app shows
      # under What's new. The lines come from CHANGELOG.md, so writing the notes
      # is part of cutting the release rather than a thing to remember. A release
      # with nothing to say is caught here, before the build, not on the page.
      - name: Collect what changed
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.name }}"

          # Read through a copy with the line endings evened out, so a checkout
          # that has been rewritten with carriage returns still matches.
          tr -d '\r' < CHANGELOG.md > "${RUNNER_TEMP}/changelog.md"

          if ! grep -qx "## ${VERSION}" "${RUNNER_TEMP}/changelog.md"; then
            echo "::error::CHANGELOG.md has no '## ${VERSION}' section. Add one line per change under it, then run this again."
            exit 1
          fi

          awk -v heading="## ${VERSION}" '
            $0 == heading { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' "${RUNNER_TEMP}/changelog.md" \
            | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac \
            > "${RUNNER_TEMP}/notes.md"

          if [ ! -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "::error::The '## ${VERSION}' section of CHANGELOG.md is empty. Write a line for each change."
            exit 1
          fi

          {
            cat "${RUNNER_TEMP}/notes.md"
            echo
            echo "Download \`frigo-${VERSION}.apk\` and open it on the phone."
            echo
            echo "Signed with the Frigo release key, so later versions install over this one"
            echo "without uninstalling anything first."
            echo
            echo "First time on the phone, Android asks whether to allow installing from this"
            echo "browser or app. That prompt is Android's, not Frigo's."
          } > "${RUNNER_TEMP}/body.md"

          echo "Release notes:"
          cat "${RUNNER_TEMP}/body.md"

      # A release nobody can install is worse than no release, so a missing
      # keystore stops the run here rather than producing an unsigned APK.
      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 is not set on this repository"
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"

      - name: Build the signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionCode="${{ steps.version.outputs.code }}" \
            -PversionName="${{ steps.version.outputs.name }}"

      - name: Verify the APK is signed
        run: |
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort | tail -n 1)"
          "${APKSIGNER}" verify --print-certs app/build/outputs/apk/release/app-release.apk

      # One APK, renamed so it says what it is: a release page is read on a phone,
      # where "app-release.apk" tells you nothing and the version is the point.
      - name: Name the file for the release page
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          DIR=app/build/outputs/apk/release
          cp "${DIR}/app-release.apk" "${DIR}/frigo-${VERSION}.apk"
          ls -la "${DIR}"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Frigo ${{ steps.version.outputs.name }}
          body_path: ${{ runner.temp }}/body.md
          files: |
            app/build/outputs/apk/release/frigo-*.apk
