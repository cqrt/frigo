# Project-wide Gradle settings.
#
# The Gradle daemon JVM is pinned to JDK 23 in the user-level file
# ~/.gradle/gradle.properties (org.gradle.java.home), because Gradle 8.13 cannot
# run on the newer JDK this machine has on PATH. It is deliberately not set here
# so CI, which brings its own JDK, is unaffected.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
